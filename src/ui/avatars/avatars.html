<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/public/favicon/likelion.svg" type="image/svg" />
    <title>아바타</title>
    <link rel="preload" as="font" href="/public/font/suit/SUIT-Variable.woff2" />
    <link rel="stylesheet" href="/public/font/suit/SUIT-Variable.css" />
    <link rel="stylesheet" href="/src/common/index.css" />

  </head>
  <body>
    <a href="/index.html">Index로 이동</a>
    <h1>아바타(상태디자인)</h1>
    <h2>인터렉션이 없는 경우</h2>
    <!-- 아바파 컴포넌트 (온라인 상태)-->
    <figure class="avatar">
      <img src="/src/assets/face/face1.jpg" alt="사용자 이름" />
      <figcaption><em class="sr-only">온라인</em><span class="on"></span></figure>
    <!-- 아바파 컴포넌트 (오프라인 상태)-->
    <figure class="avatar">
      <img src="/src/assets/face/face5.jpg" alt="사용자 이름" />
      <figcaption><em class="sr-only">오프라인</em><span class="off"></span></figcaption>
      
    </figure>
<hr />
<h2>인터렉션이 있는 경우</h2>
<figure class="avatar">
<button type="button" aria-label="오프라인" class="avatar-button">
      <img src="/src/assets/face/face5.jpg" alt="사용자 이름" />
</button>
</figure>
<hr />
<h2>아바타 레이아웃</h2>
<ul class="avatar-list">
    <button type="button" aria-label=online" class="avatar-button">
      <img src="/src/assets/face/face1.jpg" alt="사용자 이름1" />
</button>
 <button type="button" aria-label=online" class="avatar-button">

</button>

      <img src="/src/assets/face/face4.jpg" alt="사용자 이름4" />
</button>
 <button type="button" aria-label=online" class="avatar-button">
      <img src="/src/assets/face/face5.jpg" alt="사용자 이름5" />
</button>
 <button type="button" aria-label=online" class="avatar-button">
      <img src="/src/assets/face/face6.jpg" alt="사용자 이름6" />
</button>
 <button type="button" aria-label=online" class="avatar-button">

 <button type="button" aria-label=online" class="avatar-button">

</button>
